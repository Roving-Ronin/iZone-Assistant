name: Feature request
description: Suggest an entity, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: How you'd use it, and what you do today instead.
