name: Release

# Runs when a GitHub release is published.
# 1. Checks the release tag matches manifest.json "version".
# 2. Builds izone_assistant.zip (the integration folder's contents) and
#    attaches it to the release. HACS / the Marketplace install from this
#    zip (hacs.json zip_release), which is what the download badge counts.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach izone_assistant.zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5

      - name: Tag matches manifest.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          manifest_version=$(jq -r .version custom_components/izone_assistant/manifest.json)
          tag_version="${TAG#v}"
          echo "Release tag: $TAG  manifest version: $manifest_version"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Release tag '$TAG' does not match manifest.json version '$manifest_version'. Bump manifest.json before releasing."
            exit 1
          fi

      - name: Build izone_assistant.zip
        run: |
          cd custom_components/izone_assistant
          zip -r -q "$GITHUB_WORKSPACE/izone_assistant.zip" . -x "*/__pycache__/*" "*.pyc"
          cd "$GITHUB_WORKSPACE"
          unzip -l izone_assistant.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" izone_assistant.zip --clobber
